<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Planner — Antenas LoRa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3748; padding: 0.75rem 2rem; display: flex; align-items: center; gap: 2rem; flex-shrink: 0; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    nav a { color: #a0aec0; text-decoration: none; font-size: 0.875rem; }
    nav a:hover { color: #e2e8f0; }
    nav a.active { color: #4f6ef7; }

    main { padding: 1.5rem 2rem; max-width: 1300px; margin: 0 auto; }

    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    /* Topology selector */
    .topology-bar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; align-items: center; }
    .topology-bar span { font-size: 0.75rem; color: #718096; margin-right: 0.5rem; }
    .topo-btn {
      padding: 0.35rem 1rem; border-radius: 5px; border: 1px solid #4a5568;
      background: transparent; color: #a0aec0; font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
    }
    .topo-btn:hover { border-color: #4f6ef7; color: #e2e8f0; }
    .topo-btn.active { background: #4f6ef7; border-color: #4f6ef7; color: #fff; font-weight: 600; }

    .nodes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .node-card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem; }
    .node-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a0aec0; margin-bottom: 1rem; }

    /* Extra nodes (chain/star) */
    #extra-nodes-section { margin-bottom: 1.5rem; display: none; }
    #extra-nodes-section.visible { display: block; }
    .extra-nodes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .extra-nodes-list { display: grid; gap: 0.75rem; }
    .extra-node-card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1rem; position: relative; }
    .extra-node-card .remove-btn { position: absolute; top: 0.6rem; right: 0.75rem; background: transparent; border: none; color: #718096; cursor: pointer; font-size: 1rem; }
    .extra-node-card .remove-btn:hover { color: #fc8181; }

    .form-row { margin-bottom: 0.75rem; }
    .form-row label { display: block; font-size: 0.75rem; color: #718096; margin-bottom: 0.25rem; }
    .form-row input, .form-row select {
      width: 100%; background: #0f1117; border: 1px solid #2d3748; border-radius: 5px;
      color: #e2e8f0; padding: 0.4rem 0.6rem; font-size: 0.875rem;
    }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: #4f6ef7; }
    .form-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .global-row { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .global-row .form-row { margin-bottom: 0; min-width: 160px; }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 0.55rem 1.25rem; font-size: 0.875rem; font-weight: 600; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-outline { background: transparent; border: 1px solid #4a5568; color: #a0aec0; }
    .btn-small { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    #error-banner { display: none; background: #742a2a; border: 1px solid #fc8181; color: #fed7d7; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
    #error-banner.visible { display: block; }

    #info-banner { display: none; background: #1a365d; border: 1px solid #63b3ed; color: #bee3f8; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
    #info-banner.visible { display: block; }

    /* Map */
    #map-section { margin-bottom: 1.5rem; }
    #map-section h2 { margin-bottom: 0.75rem; }
    #map { height: 420px; border-radius: 8px; border: 1px solid #2d3748; background: #1a1d27; }

    /* Results */
    #results-section { display: none; }
    #results-section.visible { display: block; }

    .semaphore {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 1rem; font-weight: 700;
      margin-bottom: 1rem;
    }
    .sem-verde  { background: #1c4532; border: 2px solid #68d391; color: #68d391; }
    .sem-amarelo { background: #744210; border: 2px solid #f6e05e; color: #f6e05e; }
    .sem-vermelho { background: #742a2a; border: 2px solid #fc8181; color: #fc8181; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .metric { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 0.7rem; color: #718096; margin-bottom: 0.2rem; }
    .metric-value { font-size: 1.3rem; font-weight: 700; color: #90cdf4; }
    .metric-unit { font-size: 0.72rem; color: #718096; margin-left: 0.15rem; }

    .actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }

    /* Leaflet dark overrides */
    .leaflet-container { background: #2d3748 !important; }
    .leaflet-popup-content-wrapper { background: #1a1d27; color: #e2e8f0; border: 1px solid #4a5568; }
    .leaflet-popup-tip { background: #1a1d27; }
  </style>
</head>
<body>
  <header>
    <h1>Antenas LoRa</h1>
    <nav>
      <a href="/">Início</a> &nbsp;·&nbsp;
      <a href="/library.html">Biblioteca</a> &nbsp;·&nbsp;
      <a href="/sandbox.html">Sandbox</a> &nbsp;·&nbsp;
      <a href="/link-planner.html" class="active">Link Planner</a>
    </nav>
  </header>

  <main>
    <h2>Link Budget</h2>

    <div id="error-banner"></div>
    <div id="info-banner"></div>

    <!-- Topology selector -->
    <div class="topology-bar">
      <span>Topologia:</span>
      <button class="topo-btn active" data-topo="P2P">P2P</button>
      <button class="topo-btn" data-topo="CHAIN">Cadeia</button>
      <button class="topo-btn" data-topo="STAR">Estrela</button>
      <button class="topo-btn" data-topo="MESH">Malha</button>
      <button class="topo-btn" data-topo="MULTI_STAR">Multi-Estrela</button>
    </div>

    <!-- Mesh link builder (MESH / MULTI_STAR) -->
    <div id="mesh-section" style="display:none; background:#1a1d27; border:1px solid #2d3748; border-radius:8px; padding:1.25rem; margin-bottom:1.5rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
        <h2 style="margin:0;">Enlaces manuais</h2>
        <button class="btn-secondary btn-small" id="btn-connect-mode">Conectar nós</button>
      </div>
      <div id="connect-hint" style="display:none; font-size:0.8rem; color:#f6ad55; margin-bottom:0.75rem;">
        Clique no primeiro nó no mapa, depois no segundo para criar o enlace.
      </div>
      <div id="mesh-links-list" style="display:grid; gap:0.5rem;"></div>
      <div id="islands-warning" style="display:none; margin-top:0.75rem; background:#742a2a; border:1px solid #fc8181; color:#fed7d7; border-radius:6px; padding:0.6rem 1rem; font-size:0.8rem;"></div>
    </div>

    <!-- Node forms -->
    <div class="nodes-grid">
      <div class="node-card">
        <div class="node-title" id="node-a-title">Nó A — Transmissor</div>
        <div class="form-row" id="a-hub-row" style="display:none;">
          <label><input type="checkbox" id="a-is-hub" /> Hub (gateway central)</label>
        </div>
        <div class="form-row">
          <label>Nome</label>
          <input type="text" id="a-name" value="Nó A" />
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Latitude (°)</label>
            <input type="number" id="a-lat" value="-23.5505" step="0.000001" />
          </div>
          <div class="form-row">
            <label>Longitude (°)</label>
            <input type="number" id="a-lon" value="-46.6333" step="0.000001" />
          </div>
        </div>
        <div class="form-row">
          <label>Altura sobre solo (m)</label>
          <input type="number" id="a-height" value="10" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label>Antena da biblioteca</label>
          <select id="a-antenna"><option value="">— Sem antena (0 dBi) —</option></select>
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Potência Tx (dBm)</label>
            <input type="number" id="a-txpower" value="14" step="0.5" />
          </div>
          <div class="form-row">
            <label>Perda de cabo (dB)</label>
            <input type="number" id="a-cable" value="0" min="0" step="0.1" />
          </div>
        </div>
      </div>

      <div class="node-card">
        <div class="node-title">Nó B — Receptor</div>
        <div class="form-row" id="b-hub-row" style="display:none;">
          <label><input type="checkbox" id="b-is-hub" /> Hub (gateway central)</label>
        </div>
        <div class="form-row">
          <label>Nome</label>
          <input type="text" id="b-name" value="Nó B" />
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Latitude (°)</label>
            <input type="number" id="b-lat" value="-22.9068" step="0.000001" />
          </div>
          <div class="form-row">
            <label>Longitude (°)</label>
            <input type="number" id="b-lon" value="-43.1729" step="0.000001" />
          </div>
        </div>
        <div class="form-row">
          <label>Altura sobre solo (m)</label>
          <input type="number" id="b-height" value="10" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label>Antena da biblioteca</label>
          <select id="b-antenna"><option value="">— Sem antena (0 dBi) —</option></select>
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Sensibilidade Rx (dBm)</label>
            <input type="number" id="b-rxsens" value="-137" step="0.5" />
          </div>
          <div class="form-row">
            <label>Perda de cabo (dB)</label>
            <input type="number" id="b-cable" value="0" min="0" step="0.1" />
          </div>
        </div>
      </div>
    </div>

    <!-- Extra nodes (chain / star) -->
    <div id="extra-nodes-section">
      <div class="extra-nodes-header">
        <h2 id="extra-nodes-title">Nós intermediários</h2>
        <button class="btn-secondary btn-small" id="btn-add-node">+ Adicionar nó</button>
      </div>
      <div class="extra-nodes-list" id="extra-nodes-list"></div>
    </div>

    <!-- Global params + actions -->
    <div class="global-row">
      <div class="form-row">
        <label>Nome do cenário</label>
        <input type="text" id="scenario-name" value="Enlace SP–RJ" />
      </div>
      <div class="form-row">
        <label>Frequência (MHz)</label>
        <input type="number" id="frequency" value="915" min="1" step="0.001" />
      </div>
      <button class="btn-primary" id="btn-calculate">Calcular Link Budget</button>
      <button class="btn-secondary" id="btn-import-kml" title="Importar arquivo KML">Importar KML</button>
      <input type="file" id="kml-file-input" accept=".kml" style="display:none" />
    </div>

    <!-- Leaflet map -->
    <div id="map-section">
      <h2>Mapa</h2>
      <div id="map"></div>
    </div>

    <!-- Results (P2P / CHAIN / STAR) -->
    <div id="results-section">
      <div id="semaphore-badge"></div>
      <div class="results-grid" id="results-grid"></div>
      <div class="actions">
        <button class="btn-outline" id="btn-export">Exportar JSON</button>
      </div>
    </div>

    <!-- Topology results (MESH / MULTI_STAR) -->
    <div id="topo-results-section" style="display:none;">
      <div id="topo-semaphore-badge" style="margin-bottom:1rem;"></div>
      <table id="hops-table" style="width:100%; border-collapse:collapse; font-size:0.85rem; margin-bottom:1rem;">
        <thead>
          <tr style="color:#718096; border-bottom:1px solid #2d3748;">
            <th style="text-align:left; padding:0.4rem 0.6rem;">Enlace</th>
            <th style="padding:0.4rem 0.6rem;">Dist (km)</th>
            <th style="padding:0.4rem 0.6rem;">FSPL (dB)</th>
            <th style="padding:0.4rem 0.6rem;">Margem (dB)</th>
            <th style="padding:0.4rem 0.6rem;">Status</th>
          </tr>
        </thead>
        <tbody id="hops-tbody"></tbody>
      </table>
      <div class="actions">
        <button class="btn-outline" id="btn-export-topo">Exportar JSON</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { api } from "/js/api-client.js";

    const errorBanner  = document.getElementById("error-banner");
    const infoBanner   = document.getElementById("info-banner");
    const resultsSection = document.getElementById("results-section");
    const resultsGrid  = document.getElementById("results-grid");
    const semBadge     = document.getElementById("semaphore-badge");
    const btnCalculate = document.getElementById("btn-calculate");
    const btnExport    = document.getElementById("btn-export");
    const btnImportKml = document.getElementById("btn-import-kml");
    const kmlFileInput = document.getElementById("kml-file-input");
    const extraSection = document.getElementById("extra-nodes-section");
    const extraList    = document.getElementById("extra-nodes-list");
    const btnAddNode   = document.getElementById("btn-add-node");

    let lastScenarioId = null;
    let currentTopology = "P2P";
    let antennaOptions  = [];  // [{id, label}]
    let manualExtraNodes = [];  // {name, lat, lon, height_m, antenna_id, ...}
    let kmlExtraNodes  = [];   // from last KML import (NodeSpec objects)
    let kmlPolygons    = [];   // from last KML import

    // Mesh state
    let meshLinks = [];   // [{id, node_a_id, node_b_id, node_a_name, node_b_name}]
    let connectMode = false;
    let pendingNodeId = null;
    let pendingMarker = null;
    const nodeAId = _uuid();
    const nodeBId = _uuid();

    function _uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    const isMesh = () => currentTopology === "MESH" || currentTopology === "MULTI_STAR";

    // ── Leaflet map ────────────────────────────────────────────────────────────
    const lmap = L.map("map").setView([-23.0, -45.0], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
      maxZoom: 18,
    }).addTo(lmap);
    const layerMarkers = L.layerGroup().addTo(lmap);
    const layerLines   = L.layerGroup().addTo(lmap);
    const layerPolys   = L.layerGroup().addTo(lmap);

    const ICON_A     = L.divIcon({ className: "", html: `<div style="width:14px;height:14px;background:#4f6ef7;border:2px solid #fff;border-radius:50%"></div>`, iconAnchor: [7,7] });
    const ICON_B     = L.divIcon({ className: "", html: `<div style="width:14px;height:14px;background:#68d391;border:2px solid #fff;border-radius:50%"></div>`, iconAnchor: [7,7] });
    const ICON_EXTRA = L.divIcon({ className: "", html: `<div style="width:12px;height:12px;background:#f6ad55;border:2px solid #fff;border-radius:50%"></div>`, iconAnchor: [6,6] });
    const ICON_HUB   = L.divIcon({ className: "", html: `<div style="width:16px;height:16px;background:#4f6ef7;border:3px solid #f6e05e;border-radius:4px"></div>`, iconAnchor: [8,8] });
    const ICON_ISLAND= L.divIcon({ className: "", html: `<div style="width:14px;height:14px;background:#fc8181;border:2px solid #fff;border-radius:50%"></div>`, iconAnchor: [7,7] });
    const ICON_PENDING=L.divIcon({ className: "", html: `<div style="width:18px;height:18px;background:#f6e05e;border:2px solid #fff;border-radius:50%"></div>`, iconAnchor: [9,9] });

    let nodeRegistry = {};  // {nodeId: {lat, lon, name, isHub}}

    // islandIds: set of node IDs marked as islands (updated after calculate_links)
    let islandIds = new Set();

    function updateMap() {
      layerMarkers.clearLayers();
      layerLines.clearLayers();
      layerPolys.clearLayers();
      nodeRegistry = {};

      const aLat = parseFloat(document.getElementById("a-lat").value);
      const aLon = parseFloat(document.getElementById("a-lon").value);
      const bLat = parseFloat(document.getElementById("b-lat").value);
      const bLon = parseFloat(document.getElementById("b-lon").value);

      const valid = v => !isNaN(v) && isFinite(v);
      if (!valid(aLat) || !valid(aLon) || !valid(bLat) || !valid(bLon)) return;

      const aName = document.getElementById("a-name").value || "Nó A";
      const bName = document.getElementById("b-name").value || "Nó B";
      const aIsHub = document.getElementById("a-is-hub")?.checked;
      const bIsHub = document.getElementById("b-is-hub")?.checked;

      const iconForNode = (nid, isHub) => {
        if (islandIds.has(nid)) return ICON_ISLAND;
        if (nid === pendingNodeId) return ICON_PENDING;
        if (isHub && isMesh()) return ICON_HUB;
        return nid === nodeAId ? ICON_A : nid === nodeBId ? ICON_B : ICON_EXTRA;
      };

      const addNodeMarker = (nid, lat, lon, name, isHub) => {
        nodeRegistry[nid] = { lat, lon, name, isHub };
        const marker = L.marker([lat, lon], { icon: iconForNode(nid, isHub) })
          .bindPopup(`<b>${name}</b><br>${isHub ? "Hub" : "Nó"}<br>Lat: ${lat}<br>Lon: ${lon}`);
        if (isMesh()) {
          marker.on("click", () => handleNodeClick(nid, name));
        }
        marker.addTo(layerMarkers);
      };

      addNodeMarker(nodeAId, aLat, aLon, aName, aIsHub);
      addNodeMarker(nodeBId, bLat, bLon, bName, bIsHub);

      // Extra nodes
      const allExtra = [...manualExtraNodes, ...kmlExtraNodes];
      allExtra.forEach(n => {
        if (!valid(n.lat) || !valid(n.lon)) return;
        addNodeMarker(n.id, n.lat, n.lon, n.name, n.is_hub);
      });

      // Link lines (P2P / CHAIN / STAR)
      const chain = [{ lat: aLat, lon: aLon }, { lat: bLat, lon: bLon }, ...allExtra];
      if (currentTopology === "P2P") {
        L.polyline([[aLat, aLon], [bLat, bLon]], { color: "#fc8181", weight: 2, dashArray: "6 4" }).addTo(layerLines);
      } else if (currentTopology === "CHAIN") {
        for (let i = 0; i < chain.length - 1; i++) {
          L.polyline([[chain[i].lat, chain[i].lon], [chain[i+1].lat, chain[i+1].lon]], { color: "#fc8181", weight: 2, dashArray: "6 4" }).addTo(layerLines);
        }
      } else if (currentTopology === "STAR") {
        for (let i = 1; i < chain.length; i++) {
          L.polyline([[aLat, aLon], [chain[i].lat, chain[i].lon]], { color: "#fc8181", weight: 2, dashArray: "6 4" }).addTo(layerLines);
        }
      }

      // Mesh links
      if (isMesh()) {
        meshLinks.forEach(link => {
          const na = nodeRegistry[link.node_a_id];
          const nb = nodeRegistry[link.node_b_id];
          if (!na || !nb) return;
          const line = L.polyline([[na.lat, na.lon], [nb.lat, nb.lon]], { color: "#63b3ed", weight: 2.5 });
          line.bindPopup(`
            <b>${na.name} ↔ ${nb.name}</b><br>
            <button onclick="removeMeshLink('${link.id}')" style="margin-top:0.4rem;padding:0.2rem 0.6rem;background:#742a2a;color:#fff;border:none;border-radius:4px;cursor:pointer;">
              Remover
            </button>
          `);
          line.addTo(layerLines);
        });
      }

      // KML polygons
      kmlPolygons.forEach(poly => {
        if (!poly.outer_ring || poly.outer_ring.length < 3) return;
        const latlngs = poly.outer_ring.map(c => [c[1], c[0]]);
        L.polygon(latlngs, { color: "#b794f4", weight: 1.5, fillOpacity: 0.15 })
          .bindPopup(`<b>${poly.name}</b><br><em>Área de interesse (visual)</em>`)
          .addTo(layerPolys);
      });

      // Fit bounds
      const pts = chain.filter(n => valid(n.lat) && valid(n.lon)).map(n => [n.lat, n.lon]);
      if (pts.length > 0) {
        lmap.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 12 });
      }
    }

    // Global function for popup remove button
    window.removeMeshLink = (linkId) => {
      meshLinks = meshLinks.filter(l => l.id !== linkId);
      renderMeshLinks();
      updateMap();
      lmap.closePopup();
    };

    function handleNodeClick(nodeId, nodeName) {
      if (!connectMode) return;
      if (!pendingNodeId) {
        pendingNodeId = nodeId;
        updateMap();
        document.getElementById("connect-hint").textContent =
          `Nó "${nodeName}" selecionado. Clique no segundo nó para criar o enlace.`;
      } else {
        if (pendingNodeId === nodeId) { pendingNodeId = null; updateMap(); return; }
        const existing = meshLinks.find(l =>
          (l.node_a_id === pendingNodeId && l.node_b_id === nodeId) ||
          (l.node_a_id === nodeId && l.node_b_id === pendingNodeId)
        );
        if (!existing) {
          const aName = nodeRegistry[pendingNodeId]?.name || pendingNodeId;
          meshLinks.push({ id: _uuid(), node_a_id: pendingNodeId, node_b_id: nodeId, node_a_name: aName, node_b_name: nodeName });
          renderMeshLinks();
        }
        pendingNodeId = null;
        document.getElementById("connect-hint").textContent = "Enlace criado. Clique em Conectar nós para adicionar outro.";
        updateMap();
      }
    }

    function renderMeshLinks() {
      const list = document.getElementById("mesh-links-list");
      list.innerHTML = meshLinks.length === 0
        ? `<div style="font-size:0.8rem;color:#718096;">Nenhum enlace adicionado.</div>`
        : meshLinks.map(l => `
          <div style="display:flex;align-items:center;justify-content:space-between;background:#0f1117;border:1px solid #2d3748;border-radius:6px;padding:0.4rem 0.75rem;font-size:0.8rem;">
            <span>${l.node_a_name} ↔ ${l.node_b_name}</span>
            <button onclick="removeMeshLink('${l.id}')" style="background:transparent;border:none;color:#718096;cursor:pointer;font-size:0.9rem;">✕</button>
          </div>`).join("");
    }

    // Update map on coordinate change
    ["a-lat", "a-lon", "b-lat", "b-lon"].forEach(id => {
      document.getElementById(id).addEventListener("input", updateMap);
    });

    // ── Topology selector ──────────────────────────────────────────────────────
    document.querySelectorAll(".topo-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".topo-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTopology = btn.dataset.topo;
        updateTopologyUI();
        updateMap();
      });
    });

    function updateTopologyUI() {
      const nodeATitle = document.getElementById("node-a-title");
      const extraTitle = document.getElementById("extra-nodes-title");
      const meshSection = document.getElementById("mesh-section");
      const hubRows = [document.getElementById("a-hub-row"), document.getElementById("b-hub-row")];
      const calcBtn = document.getElementById("btn-calculate");

      if (currentTopology === "P2P") {
        nodeATitle.textContent = "Nó A — Transmissor";
        extraSection.classList.remove("visible");
        meshSection.style.display = "none";
        hubRows.forEach(r => r && (r.style.display = "none"));
        calcBtn.textContent = "Calcular Link Budget";
      } else if (currentTopology === "CHAIN") {
        nodeATitle.textContent = "Nó A — Início da cadeia";
        extraSection.classList.add("visible");
        extraTitle.textContent = "Nós intermediários (cadeia)";
        meshSection.style.display = "none";
        hubRows.forEach(r => r && (r.style.display = "none"));
        calcBtn.textContent = "Calcular Link Budget";
      } else if (currentTopology === "STAR") {
        nodeATitle.textContent = "Nó A — Hub central";
        extraSection.classList.add("visible");
        extraTitle.textContent = "Nós folha (estrela)";
        meshSection.style.display = "none";
        hubRows.forEach(r => r && (r.style.display = "none"));
        calcBtn.textContent = "Calcular Link Budget";
      } else if (currentTopology === "MESH") {
        nodeATitle.textContent = "Nó A";
        extraSection.classList.add("visible");
        extraTitle.textContent = "Nós da malha";
        meshSection.style.display = "block";
        hubRows.forEach(r => r && (r.style.display = "none"));
        calcBtn.textContent = "Calcular enlaces";
        renderMeshLinks();
      } else if (currentTopology === "MULTI_STAR") {
        nodeATitle.textContent = "Nó A";
        extraSection.classList.add("visible");
        extraTitle.textContent = "Nós da topologia";
        meshSection.style.display = "block";
        hubRows.forEach(r => r && (r.style.display = "block"));
        calcBtn.textContent = "Calcular enlaces";
        renderMeshLinks();
      }
    }

    // ── Extra nodes management ─────────────────────────────────────────────────
    function renderExtraNodes() {
      extraList.innerHTML = "";
      manualExtraNodes.forEach((node, idx) => {
        const card = document.createElement("div");
        card.className = "extra-node-card";
        card.innerHTML = `
          <button class="remove-btn" data-idx="${idx}">✕</button>
          <div class="form-inline">
            <div class="form-row"><label>Nome</label><input type="text" data-field="name" data-idx="${idx}" value="${node.name}" /></div>
            <div class="form-row"><label>Altura (m)</label><input type="number" data-field="height_m" data-idx="${idx}" value="${node.height_m}" min="0" step="0.1" /></div>
          </div>
          <div class="form-inline">
            <div class="form-row"><label>Latitude</label><input type="number" data-field="lat" data-idx="${idx}" value="${node.lat}" step="0.000001" /></div>
            <div class="form-row"><label>Longitude</label><input type="number" data-field="lon" data-idx="${idx}" value="${node.lon}" step="0.000001" /></div>
          </div>
          <div class="form-row">
            <label>Antena da biblioteca</label>
            <select data-field="antenna_id" data-idx="${idx}">
              <option value="">— Sem antena —</option>
              ${antennaOptions.map(a => `<option value="${a.id}" ${node.antenna_id === a.id ? "selected" : ""}>${a.label}</option>`).join("")}
            </select>
          </div>
        `;
        extraList.appendChild(card);
      });

      // Show KML-imported nodes as read-only info
      if (kmlExtraNodes.length > 0) {
        const header = document.createElement("div");
        header.style.cssText = "font-size:0.75rem;color:#718096;margin-top:0.75rem;margin-bottom:0.4rem;";
        header.textContent = `${kmlExtraNodes.length} nó(s) importados via KML (somente leitura):`;
        extraList.appendChild(header);
        kmlExtraNodes.forEach(node => {
          const row = document.createElement("div");
          row.className = "extra-node-card";
          row.style.opacity = "0.7";
          row.innerHTML = `
            <div style="font-size:0.8rem;font-weight:600;margin-bottom:0.4rem;">${node.name}</div>
            <div style="font-size:0.75rem;color:#a0aec0;">
              Lat: ${node.lat} &nbsp; Lon: ${node.lon} &nbsp; Alt: ${node.height_m} m
              <br><em>Importado via KML</em>
            </div>
            <div class="form-row" style="margin-top:0.5rem;">
              <label>Antena da biblioteca</label>
              <select data-kml-idx="${kmlExtraNodes.indexOf(node)}">
                <option value="">— Sem antena —</option>
                ${antennaOptions.map(a => `<option value="${a.id}" ${node.antenna_id === a.id ? "selected" : ""}>${a.label}</option>`).join("")}
              </select>
            </div>
          `;
          extraList.appendChild(row);
        });
      }

      // Bind events
      extraList.querySelectorAll(".remove-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          manualExtraNodes.splice(parseInt(btn.dataset.idx), 1);
          renderExtraNodes();
          updateMap();
        });
      });
      extraList.querySelectorAll("input[data-idx], select[data-field][data-idx]").forEach(el => {
        el.addEventListener("input", () => {
          const idx = parseInt(el.dataset.idx);
          const field = el.dataset.field;
          manualExtraNodes[idx][field] = (field === "name" || field === "antenna_id") ? el.value : parseFloat(el.value) || 0;
          updateMap();
        });
      });
      extraList.querySelectorAll("select[data-kml-idx]").forEach(sel => {
        sel.addEventListener("change", () => {
          const idx = parseInt(sel.dataset.kmlIdx);
          kmlExtraNodes[idx].antenna_id = sel.value || null;
        });
      });
    }

    btnAddNode.addEventListener("click", () => {
      manualExtraNodes.push({ id: _uuid(), name: `Nó ${manualExtraNodes.length + 3}`, lat: 0, lon: 0, height_m: 0, antenna_id: null, tx_power_dbm: 14, rx_sensitivity_dbm: -137, cable_loss_db: 0, is_hub: false });
      renderExtraNodes();
    });

    // Connect mode button
    document.getElementById("btn-connect-mode").addEventListener("click", () => {
      connectMode = !connectMode;
      pendingNodeId = null;
      const hint = document.getElementById("connect-hint");
      const btn = document.getElementById("btn-connect-mode");
      if (connectMode) {
        btn.textContent = "✕ Cancelar conexão";
        btn.style.background = "#744210";
        hint.style.display = "block";
        hint.textContent = "Clique no primeiro nó no mapa.";
      } else {
        btn.textContent = "Conectar nós";
        btn.style.background = "";
        hint.style.display = "none";
      }
      updateMap();
    });

    // ── Load antenna dropdowns ─────────────────────────────────────────────────
    async function loadAntennas() {
      try {
        const list = await api.listAntennas();
        antennaOptions = list.map(ant => ({
          id: ant.id,
          label: `${ant.name} (${ant.type}, ${(ant.frequency_hz / 1e6).toFixed(1)} MHz)`,
        }));
        ["a-antenna", "b-antenna"].forEach(id => {
          const sel = document.getElementById(id);
          antennaOptions.forEach(({ id: aId, label }) => {
            const opt = document.createElement("option");
            opt.value = aId;
            opt.textContent = label;
            sel.appendChild(opt);
          });
        });
      } catch {}
    }

    // ── Error / info banners ───────────────────────────────────────────────────
    function showError(msg) { errorBanner.textContent = msg; errorBanner.classList.add("visible"); infoBanner.classList.remove("visible"); }
    function showInfo(msg)  { infoBanner.textContent = msg; infoBanner.classList.add("visible"); errorBanner.classList.remove("visible"); }
    function clearBanners() { errorBanner.classList.remove("visible"); infoBanner.classList.remove("visible"); }

    // ── Validate inputs ────────────────────────────────────────────────────────
    function validate() {
      const freq = parseFloat(document.getElementById("frequency").value);
      if (!freq || freq <= 0) { showError("Frequência deve ser maior que 0."); return false; }
      const aLat = parseFloat(document.getElementById("a-lat").value);
      const aLon = parseFloat(document.getElementById("a-lon").value);
      const bLat = parseFloat(document.getElementById("b-lat").value);
      const bLon = parseFloat(document.getElementById("b-lon").value);
      if ([aLat, aLon, bLat, bLon].some(isNaN)) { showError("Coordenadas inválidas."); return false; }
      if (aLat < -90 || aLat > 90 || bLat < -90 || bLat > 90) { showError("Latitude fora do intervalo [-90, 90]."); return false; }
      if (aLon < -180 || aLon > 180 || bLon < -180 || bLon > 180) { showError("Longitude fora do intervalo [-180, 180]."); return false; }
      return true;
    }

    // ── Build scenario payload ─────────────────────────────────────────────────
    function buildScenario() {
      const g = id => document.getElementById(id);
      const allExtra = [...manualExtraNodes, ...kmlExtraNodes];
      return {
        name: g("scenario-name").value || "Cenário",
        topology_type: currentTopology,
        node_a: {
          id: nodeAId,
          name: g("a-name").value || "Nó A",
          lat: parseFloat(g("a-lat").value),
          lon: parseFloat(g("a-lon").value),
          height_m: parseFloat(g("a-height").value) || 0,
          antenna_id: g("a-antenna").value || null,
          tx_power_dbm: parseFloat(g("a-txpower").value) || 14,
          cable_loss_db: parseFloat(g("a-cable").value) || 0,
          rx_sensitivity_dbm: -137,
          is_hub: g("a-is-hub")?.checked ?? false,
        },
        node_b: {
          id: nodeBId,
          name: g("b-name").value || "Nó B",
          lat: parseFloat(g("b-lat").value),
          lon: parseFloat(g("b-lon").value),
          height_m: parseFloat(g("b-height").value) || 0,
          antenna_id: g("b-antenna").value || null,
          tx_power_dbm: 14,
          rx_sensitivity_dbm: parseFloat(g("b-rxsens").value) || -137,
          cable_loss_db: parseFloat(g("b-cable").value) || 0,
          is_hub: g("b-is-hub")?.checked ?? false,
        },
        extra_nodes: allExtra.map(n => ({
          id: n.id,
          name: n.name,
          lat: n.lat,
          lon: n.lon,
          height_m: n.height_m || 0,
          antenna_id: n.antenna_id || null,
          tx_power_dbm: n.tx_power_dbm || 14,
          rx_sensitivity_dbm: n.rx_sensitivity_dbm || -137,
          cable_loss_db: n.cable_loss_db || 0,
          is_hub: n.is_hub || false,
        })),
        links: isMesh() ? meshLinks.map(l => ({ id: l.id, node_a_id: l.node_a_id, node_b_id: l.node_b_id })) : [],
        polygons: kmlPolygons,
        frequency_hz: parseFloat(g("frequency").value) * 1e6,
      };
    }

    // ── Ensure scenario exists ─────────────────────────────────────────────────
    async function ensureScenario() {
      if (lastScenarioId) return lastScenarioId;
      const scenario = buildScenario();
      const created = await api.createScenario(scenario);
      lastScenarioId = created.id;
      return lastScenarioId;
    }

    // ── Render results ─────────────────────────────────────────────────────────
    function renderResults(r) {
      const semClasses = { verde: "sem-verde", amarelo: "sem-amarelo", vermelho: "sem-vermelho" };
      const semLabels  = { verde: "✓ Enlace viável", amarelo: "⚠ Margem apertada", vermelho: "✗ Enlace inviável" };
      semBadge.innerHTML = `<div class="semaphore ${semClasses[r.feasibility]}">${semLabels[r.feasibility]} — margem ${r.link_margin_db > 0 ? "+" : ""}${r.link_margin_db} dB</div>`;
      resultsGrid.innerHTML = `
        <div class="metric">
          <div class="metric-label">Distância</div>
          <div class="metric-value">${(r.distance_m / 1000).toFixed(2)}<span class="metric-unit">km</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Azimute</div>
          <div class="metric-value">${r.azimuth_deg}<span class="metric-unit">°</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Elevação</div>
          <div class="metric-value">${r.elevation_deg}<span class="metric-unit">°</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">FSPL</div>
          <div class="metric-value">${r.fspl_db}<span class="metric-unit">dB</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Potência Rx</div>
          <div class="metric-value">${r.rx_power_dbm}<span class="metric-unit">dBm</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Margem de Enlace</div>
          <div class="metric-value">${r.link_margin_db}<span class="metric-unit">dB</span></div>
        </div>
      `;
      resultsSection.classList.add("visible");
    }

    // ── Calculate ──────────────────────────────────────────────────────────────
    btnCalculate.addEventListener("click", async () => {
      clearBanners();
      if (!validate()) return;
      btnCalculate.disabled = true;
      btnCalculate.textContent = "Calculando…";
      try {
        const scenario = buildScenario();
        const created = await api.createScenario(scenario);
        lastScenarioId = created.id;

        if (isMesh()) {
          const topoResult = await fetch(`/api/v1/scenarios/${created.id}/calculate_links`, { method: "POST" });
          if (!topoResult.ok) throw new Error((await topoResult.json()).detail ?? "Erro ao calcular");
          const data = await topoResult.json();
          renderTopoResults(data);
          islandIds = new Set(data.islands);
          updateMap();
        } else {
          const result = await api.calculateScenario(created.id);
          renderResults(result);
          updateMap();
        }
      } catch (e) {
        showError("Erro: " + (e.detail ?? e.message ?? "erro desconhecido"));
      } finally {
        btnCalculate.disabled = false;
        btnCalculate.textContent = isMesh() ? "Calcular enlaces" : "Calcular Link Budget";
      }
    });

    function renderTopoResults(data) {
      const semClasses = { verde: "sem-verde", amarelo: "sem-amarelo", vermelho: "sem-vermelho" };
      const semLabels  = { verde: "✓ Rede viável", amarelo: "⚠ Margem apertada", vermelho: "✗ Rede inviável" };
      const topo = document.getElementById("topo-results-section");
      const badge = document.getElementById("topo-semaphore-badge");
      const tbody = document.getElementById("hops-tbody");

      badge.innerHTML = `<div class="semaphore ${semClasses[data.feasibility]}">${semLabels[data.feasibility]} — gargalo ${data.bottleneck_margin_db > 0 ? "+" : ""}${data.bottleneck_margin_db} dB</div>`;

      if (data.hops.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:0.75rem;color:#718096;text-align:center;">Nenhum enlace configurado.</td></tr>`;
      } else {
        tbody.innerHTML = data.hops.map(h => {
          const cls = h.feasibility === "verde" ? "#68d391" : h.feasibility === "amarelo" ? "#f6e05e" : "#fc8181";
          return `<tr style="border-bottom:1px solid #2d3748;">
            <td style="padding:0.4rem 0.6rem;">${h.node_a_name} ↔ ${h.node_b_name}</td>
            <td style="text-align:center;padding:0.4rem;">${(h.distance_m/1000).toFixed(2)}</td>
            <td style="text-align:center;padding:0.4rem;">${h.fspl_db}</td>
            <td style="text-align:center;padding:0.4rem;color:${cls};font-weight:600;">${h.link_margin_db > 0 ? "+" : ""}${h.link_margin_db}</td>
            <td style="text-align:center;padding:0.4rem;color:${cls};">●</td>
          </tr>`;
        }).join("");
      }

      if (data.islands.length > 0) {
        const warn = document.getElementById("islands-warning");
        warn.style.display = "block";
        warn.textContent = `⚠ Nós sem enlace (ilhas): ${data.islands.length} nó(s) não conectado(s). Adicione enlaces para cobrir todos os nós.`;
      }

      document.getElementById("results-section").style.display = "none";
      topo.style.display = "block";
    }

    // ── KML import ─────────────────────────────────────────────────────────────
    btnImportKml.addEventListener("click", () => kmlFileInput.click());

    kmlFileInput.addEventListener("change", async () => {
      const file = kmlFileInput.files[0];
      if (!file) return;
      clearBanners();
      btnImportKml.disabled = true;
      btnImportKml.textContent = "Importando…";
      try {
        if (!validate()) return;
        const scenarioId = await ensureScenario();
        const formData = new FormData();
        formData.append("file", file);
        const resp = await fetch(`/api/v1/scenarios/${scenarioId}/kml`, { method: "POST", body: formData });
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail ?? "Erro no servidor");
        }
        const result = await resp.json();
        kmlExtraNodes = result.nodes;
        kmlPolygons   = result.polygons;
        showInfo(`KML importado: ${result.nodes_imported} nó(s), ${result.polygons_imported} polígono(s).`);
        if (currentTopology === "P2P" && result.nodes_imported > 0) {
          showInfo(`KML importado: ${result.nodes_imported} nó(s), ${result.polygons_imported} polígono(s). Troque a topologia para Cadeia ou Estrela para visualizar os nós importados no cálculo.`);
        }
        renderExtraNodes();
        updateMap();
      } catch (e) {
        showError("Erro ao importar KML: " + (e.message ?? "erro desconhecido"));
      } finally {
        btnImportKml.disabled = false;
        btnImportKml.textContent = "Importar KML";
        kmlFileInput.value = "";
      }
    });

    // ── Export topo results ────────────────────────────────────────────────────
    document.getElementById("btn-export-topo").addEventListener("click", async () => {
      if (!lastScenarioId) return;
      try {
        const full = await api.getScenario(lastScenarioId);
        const blob = new Blob([JSON.stringify(full, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${full.name.replace(/\s+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        showError("Erro ao exportar: " + (e.detail ?? "erro desconhecido"));
      }
    });

    // ── Export ─────────────────────────────────────────────────────────────────
    btnExport.addEventListener("click", async () => {
      if (!lastScenarioId) return;
      try {
        const full = await api.getScenario(lastScenarioId);
        const blob = new Blob([JSON.stringify(full, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${full.name.replace(/\s+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        showError("Erro ao exportar: " + (e.detail ?? "erro desconhecido"));
      }
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    await loadAntennas();
    updateMap();
  </script>
</body>
</html>
