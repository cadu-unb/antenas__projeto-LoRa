<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Planner — Antenas LoRa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3748; padding: 0.75rem 2rem; display: flex; align-items: center; gap: 2rem; flex-shrink: 0; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    nav a { color: #a0aec0; text-decoration: none; font-size: 0.875rem; }
    nav a:hover { color: #e2e8f0; }
    nav a.active { color: #4f6ef7; }

    main { padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    .nodes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .node-card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem; }
    .node-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a0aec0; margin-bottom: 1rem; }

    .form-row { margin-bottom: 0.75rem; }
    .form-row label { display: block; font-size: 0.75rem; color: #718096; margin-bottom: 0.25rem; }
    .form-row input, .form-row select {
      width: 100%; background: #0f1117; border: 1px solid #2d3748; border-radius: 5px;
      color: #e2e8f0; padding: 0.4rem 0.6rem; font-size: 0.875rem;
    }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: #4f6ef7; }
    .form-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .global-row { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 2rem; align-items: flex-end; flex-wrap: wrap; }
    .global-row .form-row { margin-bottom: 0; min-width: 180px; }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 0.55rem 1.25rem; font-size: 0.875rem; font-weight: 600; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #4a5568; color: #a0aec0; }

    #error-banner { display: none; background: #742a2a; border: 1px solid #fc8181; color: #fed7d7; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
    #error-banner.visible { display: block; }

    /* Results */
    #results-section { display: none; }
    #results-section.visible { display: block; }

    .semaphore {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 1rem; font-weight: 700;
      margin-bottom: 1rem;
    }
    .sem-verde  { background: #1c4532; border: 2px solid #68d391; color: #68d391; }
    .sem-amarelo { background: #744210; border: 2px solid #f6e05e; color: #f6e05e; }
    .sem-vermelho { background: #742a2a; border: 2px solid #fc8181; color: #fc8181; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .metric { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 0.7rem; color: #718096; margin-bottom: 0.2rem; }
    .metric-value { font-size: 1.3rem; font-weight: 700; color: #90cdf4; }
    .metric-unit { font-size: 0.72rem; color: #718096; margin-left: 0.15rem; }

    .actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Antenas LoRa</h1>
    <nav>
      <a href="/">Início</a> &nbsp;·&nbsp;
      <a href="/library.html">Biblioteca</a> &nbsp;·&nbsp;
      <a href="/sandbox.html">Sandbox</a> &nbsp;·&nbsp;
      <a href="/link-planner.html" class="active">Link Planner</a>
    </nav>
  </header>

  <main>
    <h2>Link Budget P2P</h2>

    <div id="error-banner"></div>

    <!-- Node forms -->
    <div class="nodes-grid">
      <div class="node-card">
        <div class="node-title">Nó A — Transmissor</div>
        <div class="form-row">
          <label>Nome</label>
          <input type="text" id="a-name" value="Nó A" />
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Latitude (°)</label>
            <input type="number" id="a-lat" value="-23.5505" step="0.000001" />
          </div>
          <div class="form-row">
            <label>Longitude (°)</label>
            <input type="number" id="a-lon" value="-46.6333" step="0.000001" />
          </div>
        </div>
        <div class="form-row">
          <label>Altura sobre solo (m)</label>
          <input type="number" id="a-height" value="10" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label>Antena da biblioteca</label>
          <select id="a-antenna"><option value="">— Sem antena (0 dBi) —</option></select>
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Potência Tx (dBm)</label>
            <input type="number" id="a-txpower" value="14" step="0.5" />
          </div>
          <div class="form-row">
            <label>Perda de cabo (dB)</label>
            <input type="number" id="a-cable" value="0" min="0" step="0.1" />
          </div>
        </div>
      </div>

      <div class="node-card">
        <div class="node-title">Nó B — Receptor</div>
        <div class="form-row">
          <label>Nome</label>
          <input type="text" id="b-name" value="Nó B" />
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Latitude (°)</label>
            <input type="number" id="b-lat" value="-22.9068" step="0.000001" />
          </div>
          <div class="form-row">
            <label>Longitude (°)</label>
            <input type="number" id="b-lon" value="-43.1729" step="0.000001" />
          </div>
        </div>
        <div class="form-row">
          <label>Altura sobre solo (m)</label>
          <input type="number" id="b-height" value="10" min="0" step="0.1" />
        </div>
        <div class="form-row">
          <label>Antena da biblioteca</label>
          <select id="b-antenna"><option value="">— Sem antena (0 dBi) —</option></select>
        </div>
        <div class="form-inline">
          <div class="form-row">
            <label>Sensibilidade Rx (dBm)</label>
            <input type="number" id="b-rxsens" value="-137" step="0.5" />
          </div>
          <div class="form-row">
            <label>Perda de cabo (dB)</label>
            <input type="number" id="b-cable" value="0" min="0" step="0.1" />
          </div>
        </div>
      </div>
    </div>

    <!-- Global params + calculate -->
    <div class="global-row">
      <div class="form-row">
        <label>Nome do cenário</label>
        <input type="text" id="scenario-name" value="Enlace SP–RJ" />
      </div>
      <div class="form-row">
        <label>Frequência (MHz)</label>
        <input type="number" id="frequency" value="915" min="1" step="0.001" />
      </div>
      <button class="btn-primary" id="btn-calculate">Calcular Link Budget</button>
    </div>

    <!-- Results -->
    <div id="results-section">
      <div id="semaphore-badge"></div>
      <div class="results-grid" id="results-grid"></div>
      <div class="actions">
        <button class="btn-outline" id="btn-export">Exportar JSON</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { api } from "/js/api-client.js";

    const errorBanner = document.getElementById("error-banner");
    const resultsSection = document.getElementById("results-section");
    const resultsGrid = document.getElementById("results-grid");
    const semBadge = document.getElementById("semaphore-badge");
    const btnCalculate = document.getElementById("btn-calculate");
    const btnExport = document.getElementById("btn-export");

    let lastScenarioId = null;

    // ── Load antenna dropdowns ─────────────────────────────────────────────────
    async function loadAntennas() {
      try {
        const list = await api.listAntennas();
        ["a-antenna", "b-antenna"].forEach(id => {
          const sel = document.getElementById(id);
          list.forEach(ant => {
            const opt = document.createElement("option");
            opt.value = ant.id;
            const freqMhz = (ant.frequency_hz / 1e6).toFixed(1);
            opt.textContent = `${ant.name} (${ant.type}, ${freqMhz} MHz)`;
            sel.appendChild(opt);
          });
        });
      } catch {}
    }

    // ── Error handling ─────────────────────────────────────────────────────────
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }
    function clearError() { errorBanner.classList.remove("visible"); }

    // ── Validate inputs ────────────────────────────────────────────────────────
    function validate() {
      const freq = parseFloat(document.getElementById("frequency").value);
      if (!freq || freq <= 0) { showError("Frequência deve ser maior que 0."); return false; }
      const aLat = parseFloat(document.getElementById("a-lat").value);
      const aLon = parseFloat(document.getElementById("a-lon").value);
      const bLat = parseFloat(document.getElementById("b-lat").value);
      const bLon = parseFloat(document.getElementById("b-lon").value);
      if ([aLat, aLon, bLat, bLon].some(isNaN)) { showError("Coordenadas inválidas."); return false; }
      if (aLat < -90 || aLat > 90 || bLat < -90 || bLat > 90) { showError("Latitude fora do intervalo [-90, 90]."); return false; }
      if (aLon < -180 || aLon > 180 || bLon < -180 || bLon > 180) { showError("Longitude fora do intervalo [-180, 180]."); return false; }
      return true;
    }

    // ── Build scenario payload ─────────────────────────────────────────────────
    function buildScenario() {
      const g = id => document.getElementById(id);
      const antA = g("a-antenna").value || null;
      const antB = g("b-antenna").value || null;
      return {
        name: g("scenario-name").value || "Cenário",
        node_a: {
          name: g("a-name").value || "Nó A",
          lat: parseFloat(g("a-lat").value),
          lon: parseFloat(g("a-lon").value),
          height_m: parseFloat(g("a-height").value) || 0,
          antenna_id: antA,
          tx_power_dbm: parseFloat(g("a-txpower").value) || 14,
          cable_loss_db: parseFloat(g("a-cable").value) || 0,
          rx_sensitivity_dbm: -137,
        },
        node_b: {
          name: g("b-name").value || "Nó B",
          lat: parseFloat(g("b-lat").value),
          lon: parseFloat(g("b-lon").value),
          height_m: parseFloat(g("b-height").value) || 0,
          antenna_id: antB,
          tx_power_dbm: 14,
          rx_sensitivity_dbm: parseFloat(g("b-rxsens").value) || -137,
          cable_loss_db: parseFloat(g("b-cable").value) || 0,
        },
        frequency_hz: parseFloat(g("frequency").value) * 1e6,
      };
    }

    // ── Render results ─────────────────────────────────────────────────────────
    function renderResults(r) {
      const semClasses = { verde: "sem-verde", amarelo: "sem-amarelo", vermelho: "sem-vermelho" };
      const semLabels  = { verde: "✓ Enlace viável", amarelo: "⚠ Margem apertada", vermelho: "✗ Enlace inviável" };
      semBadge.innerHTML = `<div class="semaphore ${semClasses[r.feasibility]}">${semLabels[r.feasibility]} — margem ${r.link_margin_db > 0 ? "+" : ""}${r.link_margin_db} dB</div>`;

      resultsGrid.innerHTML = `
        <div class="metric">
          <div class="metric-label">Distância</div>
          <div class="metric-value">${(r.distance_m / 1000).toFixed(2)}<span class="metric-unit">km</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Azimute</div>
          <div class="metric-value">${r.azimuth_deg}<span class="metric-unit">°</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Elevação</div>
          <div class="metric-value">${r.elevation_deg}<span class="metric-unit">°</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">FSPL</div>
          <div class="metric-value">${r.fspl_db}<span class="metric-unit">dB</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Potência Rx</div>
          <div class="metric-value">${r.rx_power_dbm}<span class="metric-unit">dBm</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">Margem de Enlace</div>
          <div class="metric-value">${r.link_margin_db}<span class="metric-unit">dB</span></div>
        </div>
      `;
      resultsSection.classList.add("visible");
    }

    // ── Calculate ──────────────────────────────────────────────────────────────
    btnCalculate.addEventListener("click", async () => {
      clearError();
      if (!validate()) return;

      btnCalculate.disabled = true;
      btnCalculate.textContent = "Calculando…";

      try {
        const scenario = buildScenario();
        const created = await api.createScenario(scenario);
        lastScenarioId = created.id;
        const result = await api.calculateScenario(created.id);
        renderResults(result);
      } catch (e) {
        showError("Erro: " + (e.detail ?? e.message ?? "erro desconhecido"));
      } finally {
        btnCalculate.disabled = false;
        btnCalculate.textContent = "Calcular Link Budget";
      }
    });

    // ── Export ─────────────────────────────────────────────────────────────────
    btnExport.addEventListener("click", async () => {
      if (!lastScenarioId) return;
      try {
        const full = await api.getScenario(lastScenarioId);
        const blob = new Blob([JSON.stringify(full, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${full.name.replace(/\s+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        showError("Erro ao exportar: " + (e.detail ?? "erro desconhecido"));
      }
    });

    loadAntennas();
  </script>
</body>
</html>
