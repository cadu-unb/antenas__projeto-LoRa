<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca — Antenas LoRa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header { background: #1a1d27; border-bottom: 1px solid #2d3748; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    nav a { color: #a0aec0; text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: #e2e8f0; }

    main { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; flex-wrap: wrap; }
    .toolbar h2 { font-size: 1.1rem; font-weight: 600; flex: 1; }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; transition: opacity 0.15s; }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-danger  { background: #e53e3e; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #4a5568; color: #a0aec0; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

    #error-banner { display: none; background: #742a2a; border: 1px solid #fc8181; color: #fed7d7; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
    #error-banner.visible { display: block; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { background: #1a1d27; color: #a0aec0; text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid #2d3748; font-weight: 500; }
    td { padding: 0.65rem 0.75rem; border-bottom: 1px solid #2d3748; vertical-align: middle; }
    tr:hover td { background: #1a1d27; }

    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; background: #2d3748; color: #90cdf4; }
    .empty { color: #4a5568; text-align: center; padding: 3rem; }

    #import-input { display: none; }

    /* LoRa modules panel */
    #lora-modules-panel { margin-top: 2rem; }
    #lora-modules-panel h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
    #lora-modules-panel h3 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.75rem; }
    .lora-card { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .lora-card-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
    .lora-card-detail { font-size: 0.8rem; color: #a0aec0; }
    .energy-form { background: #1a1d27; border: 1px solid #2d3748; border-radius: 8px; padding: 1.25rem; }
    .energy-form label { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; margin-right: 1rem; margin-bottom: 0.5rem; }
    .energy-form input, .energy-form select { background: #0f1117; border: 1px solid #2d3748; border-radius: 5px; color: #e2e8f0; padding: 0.35rem 0.5rem; font-size: 0.85rem; width: 90px; }
    #energy-result { margin-top: 1rem; }
    #energy-result table { border-collapse: collapse; font-size: 0.85rem; }
    #energy-result td { padding: 0.4rem 0.75rem; border-bottom: 1px solid #2d3748; }
    #energy-result td:first-child { color: #718096; }
    #energy-result td:last-child { font-weight: 600; color: #90cdf4; }
  </style>
</head>
<body>
  <header>
    <h1>Antenas LoRa</h1>
    <nav>
      <a href="/">Início</a> &nbsp;·&nbsp;
      <a href="/library.html">Biblioteca</a> &nbsp;·&nbsp;
      <a href="/sandbox.html">Sandbox</a> &nbsp;·&nbsp;
      <a href="/link-planner.html">Link Planner</a> &nbsp;·&nbsp;
      <a href="/topology.html">Topologia</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <h2>Biblioteca de Antenas</h2>
      <button class="btn-outline" id="btn-import">Importar JSON</button>
      <input type="file" id="import-input" accept=".json,application/json" />
    </div>

    <div id="error-banner"></div>

    <div id="table-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Frequência</th>
            <th>Solver</th>
            <th>Resultados</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="antenna-list">
          <tr><td colspan="6" class="empty">Carregando…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- LoRa Modules Panel -->
    <section id="lora-modules-panel">
      <h2>Módulos LoRa</h2>
      <div id="lora-modules-list"><p style="color:#718096;font-size:0.85rem;">Carregando…</p></div>

      <h3>Estimativa de consumo energético</h3>
      <div class="energy-form">
        <div style="margin-bottom:0.75rem;">
          <label>Módulo: <select id="energy-module-select"><option value="">Carregando…</option></select></label>
          <label>SF: <select id="energy-sf">
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12" selected>12</option>
          </select></label>
          <label>Potência TX (dBm): <input id="energy-tx-power" type="number" value="20" min="0" max="30" step="1" /></label>
          <label>Transmissões/dia: <input id="energy-tx-count" type="number" value="96" min="1" step="1" /></label>
        </div>
        <button class="btn-primary" onclick="runEnergyEstimate()">Calcular</button>
        <div id="energy-result"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { api } from "/js/api-client.js";

    const tbody = document.getElementById("antenna-list");
    const errorBanner = document.getElementById("error-banner");
    const importInput = document.getElementById("import-input");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }

    function clearError() {
      errorBanner.classList.remove("visible");
    }

    function freqLabel(hz) {
      if (hz >= 1e9) return (hz / 1e9).toFixed(3) + " GHz";
      if (hz >= 1e6) return (hz / 1e6).toFixed(3) + " MHz";
      return hz + " Hz";
    }

    function renderRow(spec) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${spec.name}</td>
        <td><span class="badge">${spec.type}</span></td>
        <td>${freqLabel(spec.frequency_hz)}</td>
        <td>${spec.solver}</td>
        <td>${spec.results ? "✓" : "—"}</td>
        <td>
          <button class="btn-outline btn-sm" data-export="${spec.id}">Export</button>
          <button class="btn-danger btn-sm" data-delete="${spec.id}" style="margin-left:0.4rem">Deletar</button>
        </td>
      `;
      return tr;
    }

    async function loadList() {
      try {
        const list = await api.listAntennas();
        tbody.innerHTML = "";
        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty">Nenhuma antena salva ainda.</td></tr>`;
          return;
        }
        list.forEach(spec => tbody.appendChild(renderRow(spec)));
      } catch (e) {
        showError("Erro ao carregar lista: " + (e.detail ?? e.message ?? "erro desconhecido"));
      }
    }

    tbody.addEventListener("click", async (e) => {
      const id = e.target.dataset.delete;
      if (id) {
        clearError();
        try {
          await api.deleteAntenna(id);
          loadList();
        } catch (err) {
          showError("Erro ao deletar: " + (err.detail ?? "erro desconhecido"));
        }
      }

      const exportId = e.target.dataset.export;
      if (exportId) {
        clearError();
        try {
          const spec = await api.getAntenna(exportId);
          const blob = new Blob([JSON.stringify(spec, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `${spec.name.replace(/\s+/g, "_")}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (err) {
          showError("Erro ao exportar: " + (err.detail ?? "erro desconhecido"));
        }
      }
    });

    document.getElementById("btn-import").addEventListener("click", () => importInput.click());

    importInput.addEventListener("change", async () => {
      clearError();
      const file = importInput.files[0];
      if (!file) return;
      importInput.value = "";

      let parsed;
      try {
        parsed = JSON.parse(await file.text());
      } catch {
        showError("JSON inválido: verifique a sintaxe do arquivo.");
        return;
      }

      try {
        await api.createAntenna(parsed);
        loadList();
      } catch (err) {
        if (err.status === 422) {
          showError("Schema inválido: " + err.detail);
        } else {
          showError("Erro ao importar: " + (err.detail ?? "erro desconhecido"));
        }
      }
    });

    loadList();

    // ── LoRa modules ───────────────────────────────────────────────────────────
    async function loadLoraModules() {
      try {
        const modules = await fetch("/api/v1/antennas/lora-modules").then(r => r.json());
        const listEl = document.getElementById("lora-modules-list");
        const sel = document.getElementById("energy-module-select");
        sel.innerHTML = "";

        if (!modules.length) {
          listEl.innerHTML = `<p style="color:#718096;font-size:0.85rem;">Nenhum módulo no catálogo.</p>`;
          return;
        }

        listEl.innerHTML = modules.map(m => {
          const sf12 = (m.sensitivity_modes || []).find(s => s.sf === 12 && s.bw_khz === 125);
          const sens = sf12 ? sf12.sensitivity_dbm : "—";
          return `<div class="lora-card">
            <div class="lora-card-name">${m.name}</div>
            <div class="lora-card-detail">
              ID: ${m.id} &nbsp;·&nbsp; Freq: ${(m.frequency_hz/1e6).toFixed(0)} MHz
              &nbsp;·&nbsp; TX max: ${Math.max(...m.tx_power_options_dbm)} dBm
              &nbsp;·&nbsp; Sens. SF12: ${sens} dBm
            </div>
          </div>`;
        }).join("");

        modules.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.name;
          sel.appendChild(opt);
        });
      } catch (e) {
        document.getElementById("lora-modules-list").innerHTML =
          `<p style="color:#fc8181;font-size:0.85rem;">Erro ao carregar módulos.</p>`;
      }
    }

    window.runEnergyEstimate = async function() {
      const moduleId = document.getElementById("energy-module-select").value;
      if (!moduleId) { alert("Selecione um módulo."); return; }
      const sf = document.getElementById("energy-sf").value;
      const txPower = document.getElementById("energy-tx-power").value;
      const txCount = document.getElementById("energy-tx-count").value;
      const url = `/api/v1/antennas/lora-modules/${moduleId}/energy?sf=${sf}&tx_power_dbm=${txPower}&transmissions_per_day=${txCount}`;
      try {
        const resp = await fetch(url, { method: "POST" });
        if (!resp.ok) { alert("Erro: " + (await resp.json()).detail); return; }
        const data = await resp.json();
        const lifeStr = data.battery_life_days !== null
          ? data.battery_life_days.toFixed(0) + " dias"
          : "∞";
        document.getElementById("energy-result").innerHTML = `
          <table>
            <tr><td>Tempo no ar (ToA)</td><td>${data.tx_duration_ms.toFixed(1)} ms</td></tr>
            <tr><td>Energia por TX</td><td>${data.energy_per_tx_mj.toFixed(3)} mJ</td></tr>
            <tr><td>Energia/dia</td><td>${data.daily_energy_mwh.toFixed(3)} mWh</td></tr>
            <tr><td>Vida útil (bat. 2000 mAh / 3.3 V)</td><td>${lifeStr}</td></tr>
          </table>`;
      } catch (e) {
        document.getElementById("energy-result").innerHTML =
          `<p style="color:#fc8181;font-size:0.85rem;">Erro: ${e.message}</p>`;
      }
    };

    loadLoraModules();
  </script>
</body>
</html>
