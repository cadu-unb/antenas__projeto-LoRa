<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandbox — Antenas LoRa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3748;
      padding: 0.65rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    nav a { color: #a0aec0; text-decoration: none; font-size: 0.875rem; }
    nav a:hover { color: #e2e8f0; }
    nav a.active { color: #4f6ef7; }

    /* ── Sub-tab bar ─────────────────────────────────────────────────────────── */
    .subtab-bar {
      background: #13161f;
      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      padding: 0 1.5rem;
    }
    .subtab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #718096;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.55rem 1rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .subtab:hover { color: #a0aec0; }
    .subtab.active { color: #4f6ef7; border-bottom-color: #4f6ef7; }

    /* ── Main area ───────────────────────────────────────────────────────────── */
    .main-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      min-height: 0;
    }

    /* Tab: Config (Parâmetros + Visual) */
    #tab-config {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #tab-pattern {
      display: none;
      flex: 1;
      min-height: 0;
    }
    .main-area.show-pattern #tab-config { display: none; }
    .main-area.show-pattern #tab-pattern { display: flex; }

    .params-col {
      width: 50%;
      border-right: 1px solid #2d3748;
      padding: 1rem 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .visual-col {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }
    #svg-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #svg-wrapper svg {
      max-width: 100%;
      max-height: 100%;
    }

    /* Tab: Pattern */
    .pattern-tab-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1rem;
    }
    #pattern-3d-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    #pattern-3d-wrapper svg {
      max-height: 100%;
      max-width: 100%;
    }
    .pattern-tab-placeholder {
      color: #4a5568;
      font-size: 0.9rem;
      text-align: center;
    }
    .btn-open-eplane {
      background: #2d3748;
      border: 1px solid #4f6ef7;
      color: #90cdf4;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-open-eplane:hover { background: #374151; }
    .btn-open-eplane:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Form styles ─────────────────────────────────────────────────────────── */
    .col-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }
    .form-row { margin-bottom: 0.65rem; }
    .form-row label {
      display: block;
      font-size: 0.73rem;
      color: #a0aec0;
      margin-bottom: 0.2rem;
    }
    .form-row input,
    .form-row select {
      width: 100%;
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 5px;
      color: #e2e8f0;
      padding: 0.38rem 0.6rem;
      font-size: 0.85rem;
    }
    .form-row input:focus, .form-row select:focus {
      outline: none;
      border-color: #4f6ef7;
    }
    .form-section-title {
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #4a5568;
      margin: 0.85rem 0 0.45rem;
    }
    .field-hint {
      font-size: 0.67rem;
      color: #4a5568;
      margin-top: 0.15rem;
    }
    .metric {
      background: #1a1d27;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .metric-label { font-size: 0.7rem; color: #718096; margin-bottom: 0.25rem; }
    .metric-value { font-size: 1.4rem; font-weight: 700; color: #90cdf4; }
    .metric-unit { font-size: 0.75rem; color: #718096; margin-left: 0.2rem; }
    .metric-full { grid-column: 1 / -1; }
    .metric-small .metric-value { font-size: 1.05rem; }
    .analysis-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }
    #extra-analysis { margin-top: 0.75rem; }


    .input-error { border-color: #e53e3e !important; }
    .field-error { color: #fc8181; font-size: 0.7rem; margin-top: 0.2rem; }
    .field-note { color: #4a5568; font-size: 0.68rem; margin-top: 0.18rem; }

    /* ── Bottom bar ──────────────────────────────────────────────────────────── */
    .bottom-bar {
      background: #13161f;
      border-top: 1px solid #2d3748;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      height: 22vh;
      min-height: 140px;
      max-height: 200px;
    }

    .metrics-strip {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: 1;
      border-bottom: 1px solid #1a1d27;
      padding: 0 0.75rem;
      overflow: hidden;
    }
    .metric-compact {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-right: 1px solid #2d3748;
      min-width: 90px;
    }
    .metric-compact:last-of-type { border-right: none; }
    .mc-label { font-size: 0.65rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; }
    .mc-value { font-size: 1.3rem; font-weight: 700; color: #90cdf4; line-height: 1.1; }
    .mc-unit { font-size: 0.7rem; color: #718096; margin-left: 0.15rem; }
    .mc-placeholder { font-size: 1.1rem; color: #4a5568; }

    .pattern-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-right: 1px solid #2d3748;
    }
    .pi-label { font-size: 0.65rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
    .pi-value { font-size: 0.8rem; color: #a0aec0; }

    .solver-strip {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding: 0.5rem 1rem;
      gap: 0.25rem;
    }
    .solver-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #1a1d27;
      border: 1px solid #4f6ef7;
      color: #a0aec0;
      font-size: 0.68rem;
      white-space: nowrap;
    }
    .solver-badge.warn { border-color: #d69e2e; color: #fefcbf; background: #744210; }

    .controls-strip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      flex-shrink: 0;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-save { background: #38a169; color: #fff; }
    .btn-sim { background: #2d3748; color: #e2e8f0; }
    .btn-sim:hover { background: #374151; }

    .status-area {
      flex: 1;
      padding-left: 0.5rem;
    }
    #status-msg { font-size: 0.75rem; min-height: 1.1em; }
    .msg-ok { color: #68d391; }
    .msg-err { color: #fc8181; }

    /* Job monitor */
    #job-monitor {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      margin-top: 0.25rem;
    }
    .job-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    #job-status-text {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .status-PENDING   { color: #a0aec0; }
    .status-RUNNING   { color: #4f6ef7; }
    .status-DONE      { color: #68d391; }
    .status-CANCELLED { color: #a0aec0; }
    .status-FAILED_MEMORY_LIMIT,
    .status-FAILED_TIME_LIMIT { color: #fc8181; }
    .progress-track { height: 4px; background: #2d3748; border-radius: 2px; overflow: hidden; }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #4f6ef7;
      transition: width 0.4s ease;
      border-radius: 2px;
    }
    #job-error-msg { margin-top: 0.3rem; font-size: 0.7rem; color: #fc8181; }
    .btn-cancel-job {
      background: transparent;
      border: 1px solid #4a5568;
      color: #a0aec0;
      padding: 0.15rem 0.4rem;
      font-size: 0.65rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-cancel-job:hover { border-color: #e53e3e; color: #fc8181; }

    /* ── E-plane modal ───────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 1.25rem;
      width: min(90vw, 560px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #718096;
    }
    .btn-modal-close {
      background: transparent;
      border: 1px solid #2d3748;
      color: #718096;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-modal-close:hover { border-color: #fc8181; color: #fc8181; }
    #modal-canvas-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #modal-canvas-wrapper canvas {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Antenas LoRa</h1>
    <nav>
      <a href="/">Início</a> &nbsp;·&nbsp;
      <a href="/library.html">Biblioteca</a> &nbsp;·&nbsp;
      <a href="/sandbox.html" class="active">Sandbox</a> &nbsp;·&nbsp;
      <a href="/link-planner.html">Link Planner</a> &nbsp;·&nbsp;
      <a href="/topology.html">Topologia</a>
    </nav>
  </header>

  <div class="subtab-bar">
    <button class="subtab active" id="stab-config">⚙ Parâmetros / Visual</button>
    <button class="subtab" id="stab-pattern">📡 Padrão de Irradiação</button>
  </div>

  <div class="main-area" id="main-area">
    <!-- Tab 1: Parâmetros + Visual -->
    <div id="tab-config">
      <div class="params-col">
        <div class="col-title">Parâmetros</div>

        <div class="form-row">
          <label for="sel-type">Tipo de antena</label>
          <select id="sel-type">
            <option value="dipolo">Dipolo</option>
            <option value="monopolo">Monopolo</option>
            <option value="helicoidal">Helicoidal</option>
            <option value="parabolica">Parabólica</option>
          </select>
        </div>

        <div class="form-row">
          <label for="inp-name">Nome</label>
          <input type="text" id="inp-name" value="Minha Antena" />
        </div>

        <div class="form-section-title">Frequência</div>
        <div class="form-row">
          <label for="inp-freq">Frequência (MHz)</label>
          <input type="number" id="inp-freq" value="915" min="1" step="0.001" />
          <div class="field-error" id="err-freq"></div>
        </div>

        <div class="form-section-title">Geometria</div>
        <div id="geometry-fields"></div>
        <div id="extra-analysis"></div>
      </div>

      <div class="visual-col">
        <div id="svg-wrapper"></div>
      </div>
    </div>

    <!-- Tab 2: Padrão de Irradiação -->
    <div id="tab-pattern">
      <div class="pattern-tab-inner">
        <div id="pattern-3d-wrapper">
          <div class="pattern-tab-placeholder">Calcule ou simule para ver o padrão.</div>
        </div>
        <button class="btn-open-eplane" id="btn-open-eplane" disabled>📊 Ver Padrão Plano E</button>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="metrics-strip">
      <div class="metric-compact">
        <span class="mc-label">Ganho</span>
        <div><span class="mc-value mc-placeholder" id="m-gain">—</span><span class="mc-unit" id="m-gain-unit"></span></div>
      </div>
      <div class="metric-compact">
        <span class="mc-label">Impedância</span>
        <div><span class="mc-value mc-placeholder" id="m-imp">—</span><span class="mc-unit" id="m-imp-unit"></span></div>
      </div>
      <div class="metric-compact">
        <span class="mc-label">SWR</span>
        <div><span class="mc-value mc-placeholder" id="m-swr">—</span><span class="mc-unit" id="m-swr-unit"></span></div>
      </div>
      <div class="metric-compact">
        <span class="mc-label">Eficiência</span>
        <div><span class="mc-value mc-placeholder" id="m-eff">—</span><span class="mc-unit" id="m-eff-unit"></span></div>
      </div>
      <div class="pattern-info">
        <div class="pi-label">Padrão</div>
        <div class="pi-value" id="m-pattern">—</div>
      </div>
      <div class="solver-strip">
        <span class="solver-badge" id="solver-badge" style="display:none"></span>
        <span class="solver-badge warn" id="warning-badge" style="display:none"></span>
      </div>
    </div>

    <div class="controls-strip">
      <button class="btn-primary" id="btn-preview">⚡ Rápido</button>
      <button class="btn-sim" id="btn-sim-padrao">▶ Padrão (MoM)</button>
      <button class="btn-sim" id="btn-sim-preciso">▶▶ Preciso</button>
      <button class="btn-save" id="btn-save" disabled>💾 Salvar</button>
      <div class="status-area">
        <div id="status-msg"></div>
        <div id="job-monitor" style="display:none">
          <div class="job-status-row">
            <span id="job-status-text" class="status-PENDING">PENDING</span>
            <button class="btn-cancel-job" id="btn-cancel-job">✕</button>
          </div>
          <div class="progress-track"><div id="progress-fill"></div></div>
          <div id="job-error-msg" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- E-plane modal -->
  <div class="modal-overlay" id="eplane-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Padrão de Irradiação — Plano E</span>
        <button class="btn-modal-close" id="btn-modal-close">✕ Fechar</button>
      </div>
      <div id="modal-canvas-wrapper" style="height: 420px;"></div>
    </div>
  </div>

  <script type="module">
    import { api } from "/js/api-client.js";
    import { JobMonitor } from "/js/job-monitor.js";

    // ── State ──────────────────────────────────────────────────────────────────
    let lastResult = null;
    let activeMonitor = null;
    let lastPatternData = null;

    // ── SVG renderers ──────────────────────────────────────────────────────────
    const SVGs = {
      dipolo(geo, freqMhz) {
        const lam = 300 / freqMhz;
        const len = geo.length_m ?? lam / 2;
        const arm = Math.min(80, (len / lam) * 80);
        const diam = geo.diameter_mm ?? 1.5;
        const sw = Math.max(2, Math.min(8, diam * 1.5));
        return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
          <line x1="${-arm}" y1="0" x2="${arm}" y2="0" stroke="#90cdf4" stroke-width="${sw}" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4" fill="#4f6ef7"/>
          <text x="0" y="90" text-anchor="middle" fill="#4a5568" font-size="9">λ/2 = ${(lam/2*100).toFixed(1)} cm  ·  ø ${diam} mm</text>
        </svg>`;
      },
      monopolo(geo, freqMhz) {
        const lam = 300 / freqMhz;
        const h = geo.height_m ?? lam / 4;
        const len = Math.min(80, (h / (lam/4)) * 60);
        const diam = geo.diameter_mm ?? 1.5;
        const sw = Math.max(2, Math.min(8, diam * 1.5));
        const gndD = geo.ground_diameter_m ?? 0.25;
        return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
          <line x1="-90" y1="40" x2="90" y2="40" stroke="#68d391" stroke-width="3"/>
          <ellipse cx="0" cy="40" rx="${Math.min(85, gndD * 150)}" ry="8" fill="none" stroke="#68d391" stroke-width="1" opacity="0.4"/>
          <line x1="0" y1="40" x2="0" y2="${40 - len}" stroke="#90cdf4" stroke-width="${sw}" stroke-linecap="round"/>
          <circle cx="0" cy="40" r="4" fill="#4f6ef7"/>
          <text x="0" y="90" text-anchor="middle" fill="#4a5568" font-size="9">λ/4 = ${(lam/4*100).toFixed(1)} cm  ·  ø ${diam} mm</text>
        </svg>`;
      },
      helicoidal(geo, freqMhz) {
        const n = geo.turns ?? 8;
        const lam = 300 / freqMhz;
        const C = geo.circumference_m ?? lam;
        const pitch = geo.pitch_angle_deg ?? 14;
        const d = 40;
        let path = `M 0 80`;
        const steps = n * 12;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const angle = t * n * 2 * Math.PI;
          const x = (d / 2) * Math.cos(angle);
          const y = 80 - t * 160;
          path += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        }
        const mode = 0.75 * lam <= C && C <= 1.33 * lam ? "modo axial" : "modo normal";
        return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
          <line x1="-50" y1="80" x2="50" y2="80" stroke="#68d391" stroke-width="3"/>
          <path d="${path}" fill="none" stroke="#90cdf4" stroke-width="2.5"/>
          <circle cx="0" cy="80" r="4" fill="#4f6ef7"/>
          <text x="0" y="95" text-anchor="middle" fill="#4a5568" font-size="9">${n} espiras · ${pitch}° · ${mode}</text>
        </svg>`;
      },
      parabolica(geo, freqMhz) {
        const D = geo.diameter_m ?? 0.6;
        const f = geo.focal_length_m ?? D * 0.367;
        const eta = geo.efficiency ?? 0.55;
        const r = 85;
        const fLen = Math.min(70, (f / D) * r * 2);
        let path = `M ${-r} ${r}`;
        for (let x = -r; x <= r; x += 2) {
          const y = (x * x) / (4 * fLen) - fLen + r;
          path += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        }
        const focalY = r - fLen;
        return `<svg viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
          <path d="${path}" fill="none" stroke="#90cdf4" stroke-width="3"/>
          <line x1="${-r}" y1="${r}" x2="${r}" y2="${r}" stroke="#90cdf4" stroke-width="2"/>
          <circle cx="0" cy="${focalY}" r="5" fill="#f6e05e"/>
          <line x1="0" y1="${focalY}" x2="0" y2="${r}" stroke="#4f6ef7" stroke-width="1" stroke-dasharray="4 3"/>
          <text x="0" y="95" text-anchor="middle" fill="#4a5568" font-size="9">D=${D.toFixed(2)} m  f=${f.toFixed(2)} m  η=${Math.round(eta*100)}%</text>
        </svg>`;
      },
    };

    // ── 3D simplified pattern SVGs ─────────────────────────────────────────────
    const Pattern3D = {
      dipolo(result) {
        const gain = result?.gain_dbi ?? 2.15;
        return `<svg viewBox="-140 -130 280 270" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="lg1" cx="50%" cy="50%"><stop offset="0%" stop-color="#4f6ef7" stop-opacity="0.9"/><stop offset="100%" stop-color="#4f6ef7" stop-opacity="0.05"/></radialGradient>
          </defs>

    // ── Helpers ────────────────────────────────────────────────────────────────
    function getFreqMhz() { return parseFloat(inpFreq.value) || 915; }

    function getGeoValues() {
      const fields = GEO_FIELDS[selType.value] || [];
      const geo = {};
      fields.forEach(f => {
        const el = document.getElementById("geo-" + f.id);
        if (el) geo[f.id] = parseFloat(el.value) || 0;
      });
      return geo;
    }

    function rebuildGeoFields() {
      const type = selType.value;
      const freq = getFreqMhz();
      const fields = GEO_FIELDS[type] || [];
      geoDiv.innerHTML = "";
      fields.forEach(f => {
        const row = document.createElement("div");
        row.className = "form-row";
        const maxAttr = f.max ? `max="${f.max}"` : "";
        row.innerHTML = `<label for="geo-${f.id}">${f.label}</label>
          <input type="number" id="geo-${f.id}" value="${f.default(freq)}"
            step="${f.step || "any"}" min="${f.min || "0"}" ${maxAttr} />
          ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ""}`;
        geoDiv.appendChild(row);
        document.getElementById("geo-" + f.id).addEventListener("input", updateVisual);
      });
    }

    function updateVisual() {
      const type = selType.value;
      const freq = getFreqMhz();
      const geo  = getGeoValues();
      const renderer = SVGs[type];
      svgWrapper.innerHTML = renderer ? renderer(geo, freq) : `<div style="color:#4a5568">Sem visual</div>`;

    function update3DPattern(type, result) {

      pattern3dWrap.innerHTML = renderer(result);

    // ── Polar diagram ──────────────────────────────────────────────────────────
    function drawPolar(patternData, wrapper) {
      wrapper.innerHTML = "";
      const canvas = document.createElement("canvas");
      const size = Math.min(wrapper.clientWidth || 480, wrapper.clientHeight || 480, 480);
      canvas.width = size;
      canvas.height = size;
      wrapper.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const cx = size / 2, cy = size / 2;
      const R = size * 0.38;

      ctx.fillStyle = "#0f1117";
      ctx.fillRect(0, 0, size, size);

      [0.25, 0.5, 0.75, 1.0].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, R * r, 0, 2 * Math.PI);
        ctx.strokeStyle = "#2d3748";
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      for (let a = 0; a < 360; a += 30) {
        const rad = (a - 90) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + R * Math.cos(rad), cy + R * Math.sin(rad));
        ctx.strokeStyle = "#2d3748";
        ctx.lineWidth = 1;
        ctx.stroke();
        const lx = cx + (R + 16) * Math.cos(rad);
        const ly = cy + (R + 16) * Math.sin(rad);
        ctx.fillStyle = "#4a5568";
        ctx.font = `${Math.round(size * 0.03)}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(a + "°", lx, ly);
      }

      const maxG = Math.max(...patternData.map(p => p.gain_linear), 1e-9);
      const pts = patternData.map(p => ({
        angle_deg: p.angle_deg,
        norm: p.gain_linear / maxG,
      }));

      ctx.beginPath();
      pts.forEach((p, i) => {
        const rad = (p.angle_deg - 90) * Math.PI / 180;
        const r = p.norm * R;
        const x = cx + r * Math.cos(rad);
        const y = cy + r * Math.sin(rad);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.strokeStyle = "#4f6ef7";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "rgba(79, 110, 247, 0.15)";
      ctx.fill();

      const dbLabels = ["-12", "-6", "-3", "0"];
      [0.25, 0.5, 0.75, 1.0].forEach((r, i) => {
        ctx.fillStyle = "#718096";
        ctx.font = `${Math.round(size * 0.026)}px system-ui`;
        ctx.textAlign = "left";
        ctx.fillText(dbLabels[i] + " dB", cx + 4, cy - R * r + 3);
      });
    }

    // ── Results ────────────────────────────────────────────────────────────────
    function showResults(r) {
      lastResult = r;
      lastPatternData = r.pattern_data ?? null;
      btnSave.disabled = false;
      btnOpenEplane.disabled = !lastPatternData;

      // Metrics
      mGain.textContent = r.gain_dbi;
      mGain.classList.remove("mc-placeholder");
      mGainUnit.textContent = "dBi";

      mImp.textContent = r.impedance_ohm;
      mImp.classList.remove("mc-placeholder");
      mImpUnit.textContent = "Ω";

      mSwr.textContent = r.swr;
      mSwr.classList.remove("mc-placeholder");
      mSwrUnit.textContent = ":1";

      mEff.textContent = r.efficiency_pct;
      mEff.classList.remove("mc-placeholder");
      mEffUnit.textContent = "%";

      mPattern.textContent = r.radiation_pattern ?? "—";

      const solverLabel = {
        mom_pynec: "MoM NEC2 ✓",
        mom_analitico: "Analítico",
        abertura: "Abertura",
        rapido: "Rápido",
      }[r.solver_used] ?? r.solver_used ?? "";
      solverBadge.textContent = solverLabel;
      solverBadge.style.display = "inline-block";

      const extraAnalysis = renderExtraAnalysis(r);
      metricsDiv.innerHTML = extraAnalysis || "";

      if (r.warning) {
        warningBadge.textContent = "⚠ " + r.warning;
        warningBadge.style.display = "inline-block";
      } else {
        warningBadge.style.display = "none";
      }

      // Update 3D pattern view
      update3DPattern(selType.value, r);
    }

    function renderExtraAnalysis(result) {
      const x = result.extra || {};
      if (!x.beamwidth_deg || !x.f_d_ratio) return "";

      const farField = x.far_field_m >= 1000
        ? `${(x.far_field_m / 1000).toFixed(2)} km`
        : `${x.far_field_m.toFixed(1)} m`;

      const rows = [
        ["λ", `${(x.wavelength_m * 100).toFixed(1)} cm`],
        ["f/D", x.f_d_ratio.toFixed(3)],
        ["Profundidade", `${(x.dish_depth_m * 100).toFixed(1)} cm`],
        ["HPBW", `${x.beamwidth_deg.toFixed(2)}°`],
        ["1º nulo", `${x.first_null_deg.toFixed(2)}°`],
        ["Campo distante", farField],
        ["Área efetiva", `${x.effective_area_m2.toFixed(3)} m²`],
        ["Eficiência realizada", `${x.realized_efficiency_pct.toFixed(1)}%`],
        ["Perda superfície", `${x.surface_loss_db.toFixed(2)} dB`],
        ["Perda bloqueio", `${x.blockage_loss_db.toFixed(2)} dB`],
        ["Perdas passivas", `${x.passive_loss_db.toFixed(2)} dB`],
      ];

      return `
        <div class="metric metric-full">
          <div class="metric-label">Análise de abertura</div>
          <div class="analysis-grid">
            ${rows.map(([label, value]) => `
              <div class="metric metric-small">
                <div class="metric-label">${label}</div>
                <div class="metric-value">${value}</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    // ── Validation ─────────────────────────────────────────────────────────────

      const freq = parseFloat(inpFreq.value);

        inpFreq.classList.add("input-error");
        errFreq.textContent = "Frequência deve ser maior que 0.";
        return false;
      }
      inpFreq.classList.remove("input-error");
      errFreq.textContent = "";
      return true;
    }

    // ── Job monitor ────────────────────────────────────────────────────────────
    function showJobMonitor() {
      jobMonitorEl.style.display = "block";
      progressFill.style.width = "0%";
      jobErrorMsg.style.display = "none";
    }
    function hideJobMonitor() { jobMonitorEl.style.display = "none"; }
    function updateJobStatus(pct, status) {
      progressFill.style.width = pct + "%";
      jobStatusText.textContent = status;
      jobStatusText.className = "status-" + status;
    }
    function setSimBtnsDisabled(d) {
      btnSimPadrao.disabled = d;
      btnSimPreciso.disabled = d;
    }

    async function startSimulation(solver) {
      if (!validate()) return;
      if (activeMonitor) { activeMonitor.stop(); activeMonitor = null; }
      setSimBtnsDisabled(true);
      statusMsg.textContent = "";
      showJobMonitor();
      updateJobStatus(0, "PENDING");

      const req = {
        name: inpName.value || "Antena",
        type: selType.value,
        frequency_hz: getFreqMhz() * 1e6,
        geometry: getGeoValues(),
        solver,
      };

      let jobId;
      try {
        const ref = await api.simulateAntenna(req);
        jobId = ref.job_id;
      } catch (e) {
        statusMsg.textContent = "Erro ao iniciar: " + (e.detail ?? e.message ?? "erro");
        statusMsg.className = "msg-err";
        hideJobMonitor();
        setSimBtnsDisabled(false);
        return;
      }

      activeMonitor = new JobMonitor(jobId, {
        onProgress(pct, status) { updateJobStatus(pct, status); },
        onDone(result) {
          updateJobStatus(100, "DONE");
          statusMsg.textContent = "✓ Simulação concluída.";
          statusMsg.className = "msg-ok";
          setSimBtnsDisabled(false);
          if (result) showResults(result);
          activeMonitor = null;
        },
        onFailed(status, errorMsg) {
          updateJobStatus(0, status);
          jobErrorMsg.textContent = errorMsg;
          jobErrorMsg.style.display = "block";
          statusMsg.textContent = "Simulação falhou.";
          statusMsg.className = "msg-err";
          setSimBtnsDisabled(false);
          activeMonitor = null;
        },
        onCancelled() {
          updateJobStatus(0, "CANCELLED");
          statusMsg.textContent = "Cancelada.";
          statusMsg.className = "msg-err";
          setSimBtnsDisabled(false);
          activeMonitor = null;
        },
      });
      activeMonitor.start();
    }

    btnSimPadrao.addEventListener("click", () => startSimulation("padrao"));
    btnSimPreciso.addEventListener("click", () => startSimulation("preciso"));

    btnCancelJob.addEventListener("click", async () => {
      if (!activeMonitor) return;
      const jobId = activeMonitor.jobId;
      activeMonitor.stop();
      activeMonitor = null;
      try { await api.cancelJob(jobId); } catch (_) {}
      updateJobStatus(0, "CANCELLED");
      statusMsg.textContent = "Cancelada.";
      statusMsg.className = "msg-err";
      setSimBtnsDisabled(false);
    });

    // ── Type / freq change ─────────────────────────────────────────────────────
    selType.addEventListener("change", () => {
      rebuildGeoFields();
      updateVisual();
      lastResult = null;
      lastPatternData = null;
      btnSave.disabled = true;
      btnOpenEplane.disabled = true;
    });
    inpFreq.addEventListener("input", () => {
      rebuildGeoFields();
      updateVisual();
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    rebuildGeoFields();
    updateVisual();
  </script>
</body>
</html>
