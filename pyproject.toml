[project]
name = "antenas-projeto-lora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "contextily>=1.7.0",
    "folium>=0.17.0",
    "matplotlib>=3.10.9",
    "pydantic>=2.12.0",
    "requests>=2.32.0",
    "shapely>=2.1.0",
    "streamlit>=1.36.0",
    "streamlit-folium>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_antenna"]
