[project]
name = "antenas-projeto-lora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
mom = ["PyNEC>=1.7.3.4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.extra-build-dependencies]
pynec = ["numpy"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
]
